  output:
    file_header: |
      Title: xndeye adblock list of ${type}
      Total Size: ${total}
      Last Modified: ${date}
      Homepage: https://github.com/xndeye/adblock_list

    files:
      - name: easylist.txt
        type: easylist
        filter:
          - basic
          - wildcard
          - unknown

      - name: dns.txt
        type: easylist
        file_header: |
          Title: xndeye adblock list of dns
          Total Size: ${total}
          Last Modified: ${date}
          Homepage: https://github.com/xndeye/adblock_list
        filter:
          - basic
          - wildcard

      - name: modify.txt
        type: easylist
        filter:
          - unknown

      - name: dnsmasq.conf
        type: dnsmasq

      - name: clash.yaml
        type: clash

      - name: smartdns.conf
        type: smartdns

      - name: hosts
        type: hosts

  config:

    expected_quantity: 2000000
    fault_tolerance: 0.0001

    domain-detect:
      enable: true
      timeout: 3000
      concurrency: 128
      provider:
        - 1.1.1.1
        - 8.8.8.8

    exclude:
      - "edge.microsoft.com"
      - "metok.sys.miui.com"
      - "assets.msn.com"
#      - "firebaseinstallations.googleapis.com"
